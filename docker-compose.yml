services:
  oracle:
    image: ${DB_IMAGE:-gvenzl/oracle-xe:21-slim-faststart}
    container_name: ${DB_CONTAINER:-oracle-biblioteca}
    ports:
      - "${DB_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${DB_SYSTEM_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
